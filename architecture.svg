<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#232F3E">Scalable Web Application on AWS (ALB + Auto Scaling + Multi-AZ RDS)</text>

  <!-- Users / DNS / Edge -->
  <rect x="30" y="70" width="110" height="50" rx="8" fill="#eef2f7" stroke="#232F3E"/>
  <text x="85" y="100" text-anchor="middle">Users</text>
  <rect x="170" y="70" width="130" height="50" rx="8" fill="#8C4FFF" />
  <text x="235" y="92" text-anchor="middle" fill="#fff">Route 53</text>
  <text x="235" y="109" text-anchor="middle" fill="#fff" font-size="11">alias + health check</text>
  <rect x="330" y="70" width="150" height="50" rx="8" fill="#8C4FFF"/>
  <text x="405" y="92" text-anchor="middle" fill="#fff">CloudFront</text>
  <text x="405" y="109" text-anchor="middle" fill="#fff" font-size="11">CDN + HTTPS</text>
  <rect x="520" y="70" width="140" height="50" rx="8" fill="#3F8624"/>
  <text x="590" y="92" text-anchor="middle" fill="#fff">S3 bucket</text>
  <text x="590" y="109" text-anchor="middle" fill="#fff" font-size="11">/static/* (OAC)</text>
  <line x1="140" y1="95" x2="170" y2="95" stroke="#232F3E" stroke-width="2"/>
  <line x1="300" y1="95" x2="330" y2="95" stroke="#232F3E" stroke-width="2"/>
  <line x1="480" y1="95" x2="520" y2="95" stroke="#232F3E" stroke-width="2"/>
  <text x="500" y="88" text-anchor="middle" font-size="11" fill="#232F3E">static</text>

  <!-- Arrow CF -> ALB -->
  <line x1="405" y1="120" x2="405" y2="200" stroke="#232F3E" stroke-width="2"/>
  <polygon points="405,206 399,194 411,194" fill="#232F3E"/>
  <text x="415" y="165" font-size="11">dynamic (HTTP, CloudFront IPs only)</text>

  <!-- VPC -->
  <rect x="30" y="210" width="780" height="520" rx="10" fill="#fdfdfd" stroke="#8C4FFF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="45" y="232" font-weight="bold" fill="#8C4FFF">VPC 10.0.0.0/16</text>
  <rect x="690" y="215" width="105" height="26" rx="4" fill="#fff" stroke="#8C4FFF"/>
  <text x="742" y="232" text-anchor="middle" font-size="11">Internet Gateway</text>

  <!-- AZ A -->
  <rect x="50" y="250" width="360" height="465" rx="8" fill="#f7f9fc" stroke="#888" stroke-dasharray="4 3"/>
  <text x="65" y="270" font-weight="bold">Availability Zone A</text>
  <!-- AZ B -->
  <rect x="430" y="250" width="360" height="465" rx="8" fill="#f7f9fc" stroke="#888" stroke-dasharray="4 3"/>
  <text x="445" y="270" font-weight="bold">Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="65" y="280" width="330" height="110" rx="6" fill="#e6f4ea" stroke="#3F8624"/>
  <text x="75" y="298" font-size="12" fill="#3F8624" font-weight="bold">Public subnet 10.0.0.0/24</text>
  <rect x="445" y="280" width="330" height="110" rx="6" fill="#e6f4ea" stroke="#3F8624"/>
  <text x="455" y="298" font-size="12" fill="#3F8624" font-weight="bold">Public subnet 10.0.1.0/24</text>

  <!-- ALB spanning -->
  <rect x="150" y="310" width="500" height="34" rx="6" fill="#8C4FFF"/>
  <text x="400" y="332" text-anchor="middle" fill="#fff">Application Load Balancer (+ WAF: OWASP rules, rate limit)</text>
  <rect x="85" y="352" width="130" height="30" rx="5" fill="#ED7100"/>
  <text x="150" y="372" text-anchor="middle" fill="#fff" font-size="12">NAT Gateway</text>
  <rect x="585" y="352" width="130" height="30" rx="5" fill="#ED7100" opacity="0.55"/>
  <text x="650" y="372" text-anchor="middle" fill="#fff" font-size="12">NAT (prod: 1/AZ)</text>

  <!-- App subnets -->
  <rect x="65" y="410" width="330" height="120" rx="6" fill="#e8f0fb" stroke="#2E73B8"/>
  <text x="75" y="428" font-size="12" fill="#2E73B8" font-weight="bold">Private app subnet 10.0.10.0/24</text>
  <rect x="445" y="410" width="330" height="120" rx="6" fill="#e8f0fb" stroke="#2E73B8"/>
  <text x="455" y="428" font-size="12" fill="#2E73B8" font-weight="bold">Private app subnet 10.0.11.0/24</text>
  <rect x="95" y="445" width="120" height="60" rx="6" fill="#ED7100"/>
  <text x="155" y="470" text-anchor="middle" fill="#fff">EC2</text>
  <text x="155" y="488" text-anchor="middle" fill="#fff" font-size="11">Apache (SSM)</text>
  <rect x="235" y="445" width="120" height="60" rx="6" fill="#ED7100"/>
  <text x="295" y="470" text-anchor="middle" fill="#fff">EC2</text>
  <text x="295" y="488" text-anchor="middle" fill="#fff" font-size="11">Apache (SSM)</text>
  <rect x="475" y="445" width="120" height="60" rx="6" fill="#ED7100"/>
  <text x="535" y="470" text-anchor="middle" fill="#fff">EC2</text>
  <text x="535" y="488" text-anchor="middle" fill="#fff" font-size="11">Apache (SSM)</text>
  <rect x="615" y="445" width="120" height="60" rx="6" fill="#ED7100"/>
  <text x="675" y="470" text-anchor="middle" fill="#fff">EC2</text>
  <text x="675" y="488" text-anchor="middle" fill="#fff" font-size="11">Apache (SSM)</text>

  <!-- ASG bracket -->
  <rect x="85" y="540" width="650" height="26" rx="13" fill="#fff" stroke="#ED7100" stroke-width="2"/>
  <text x="410" y="558" text-anchor="middle" font-size="12" fill="#ED7100" font-weight="bold">Auto Scaling Group (Launch Template, target tracking: CPU 50% + requests/target)</text>

  <!-- DB subnets -->
  <rect x="65" y="585" width="330" height="115" rx="6" fill="#fbeaea" stroke="#C7131F"/>
  <text x="75" y="603" font-size="12" fill="#C7131F" font-weight="bold">Private DB subnet 10.0.20.0/24 (NACL)</text>
  <rect x="445" y="585" width="330" height="115" rx="6" fill="#fbeaea" stroke="#C7131F"/>
  <text x="455" y="603" font-size="12" fill="#C7131F" font-weight="bold">Private DB subnet 10.0.21.0/24 (NACL)</text>
  <rect x="135" y="620" width="190" height="55" rx="6" fill="#3B48CC"/>
  <text x="230" y="643" text-anchor="middle" fill="#fff">RDS MySQL - Primary</text>
  <text x="230" y="661" text-anchor="middle" fill="#fff" font-size="11">encrypted, password in Secrets Mgr</text>
  <rect x="515" y="620" width="190" height="55" rx="6" fill="#3B48CC" opacity="0.8"/>
  <text x="610" y="643" text-anchor="middle" fill="#fff">RDS - Standby</text>
  <text x="610" y="661" text-anchor="middle" fill="#fff" font-size="11">synchronous replication</text>
  <line x1="325" y1="647" x2="515" y2="647" stroke="#232F3E" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="420" y="640" text-anchor="middle" font-size="11">Multi-AZ failover</text>

  <!-- Right side: management -->
  <rect x="840" y="210" width="230" height="520" rx="10" fill="#fff" stroke="#232F3E"/>
  <text x="955" y="236" text-anchor="middle" font-weight="bold">Management &amp; Monitoring</text>
  <rect x="860" y="255" width="190" height="70" rx="6" fill="#E7157B"/>
  <text x="955" y="282" text-anchor="middle" fill="#fff">CloudWatch</text>
  <text x="955" y="302" text-anchor="middle" fill="#fff" font-size="11">Dashboard + Alarms</text>
  <rect x="860" y="345" width="190" height="70" rx="6" fill="#E7157B"/>
  <text x="955" y="372" text-anchor="middle" fill="#fff">SNS</text>
  <text x="955" y="392" text-anchor="middle" fill="#fff" font-size="11">Email notifications</text>
  <rect x="860" y="435" width="190" height="70" rx="6" fill="#E7157B"/>
  <text x="955" y="462" text-anchor="middle" fill="#fff">Systems Manager</text>
  <text x="955" y="482" text-anchor="middle" fill="#fff" font-size="11">Session Manager (no SSH)</text>
  <rect x="860" y="525" width="190" height="70" rx="6" fill="#DD344C"/>
  <text x="955" y="552" text-anchor="middle" fill="#fff">IAM Role</text>
  <text x="955" y="572" text-anchor="middle" fill="#fff" font-size="11">Instance profile</text>
  <rect x="860" y="615" width="190" height="70" rx="6" fill="#DD344C"/>
  <text x="955" y="642" text-anchor="middle" fill="#fff">Secrets Manager</text>
  <text x="955" y="662" text-anchor="middle" fill="#fff" font-size="11">DB credentials</text>
</svg>
